<svg width="560" height="400" viewBox="0 0 560 400" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Data Pack anatomy">
  <style>
    .sans { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .mono { font-family: 'SF Mono', 'Courier New', ui-monospace, monospace; }
    .name { font-size: 11.5px; font-weight: 600; fill: #23252B; }
    .note { font-size: 10px; fill: #9A9DA8; }
    .head { font-size: 10px; letter-spacing: 2px; fill: #9A9DA8; }
  </style>

  <text x="30" y="30" class="mono head">ANATOMY OF A DATA PACK</text>

  <!-- document -->
  <g transform="translate(30 46)">
    <rect width="250" height="330" rx="12" fill="#FFFFFF" stroke="#E6E3DC"/>
    <rect x="16" y="14" width="9" height="9" rx="2.5" fill="#6487FA"/>
    <text x="32" y="22" class="mono" font-size="11" font-weight="600" fill="#23252B">data.json</text>
    <line x1="16" y1="34" x2="234" y2="34" stroke="#EEECE6"/>
    <!-- rows: chip + name -->
    <g class="mono name">
      <rect x="16" y="46" width="8" height="8" rx="2" fill="#6487FA"/><text x="32" y="54">entities</text>
      <rect x="16" y="82" width="8" height="8" rx="2" fill="#8FA3E8"/><text x="32" y="90">aliases</text>
      <rect x="16" y="118" width="8" height="8" rx="2" fill="#6FA586"/><text x="32" y="126">relationTypes</text>
      <rect x="16" y="154" width="8" height="8" rx="2" fill="#6FA586"/><text x="32" y="162">relations</text>
      <rect x="16" y="190" width="8" height="8" rx="2" fill="#C2A36B"/><text x="32" y="198">stages</text>
      <rect x="16" y="226" width="8" height="8" rx="2" fill="#D78FAD"/><text x="32" y="234">contents</text>
      <rect x="16" y="262" width="8" height="8" rx="2" fill="#8B8E99"/><text x="32" y="270">sameAs</text>
      <rect x="16" y="298" width="8" height="8" rx="2" fill="#23252B"/><text x="32" y="306">provenance</text>
    </g>
  </g>

  <!-- leader lines + annotations -->
  <g stroke="#C9CDD8" stroke-width="1" stroke-dasharray="3 3">
    <line x1="280" y1="96" x2="310" y2="96"/>
    <line x1="280" y1="132" x2="310" y2="132"/>
    <line x1="280" y1="168" x2="310" y2="168"/>
    <line x1="280" y1="204" x2="310" y2="204"/>
    <line x1="280" y1="240" x2="310" y2="240"/>
    <line x1="280" y1="276" x2="310" y2="276"/>
    <line x1="280" y1="312" x2="310" y2="312"/>
    <line x1="280" y1="348" x2="310" y2="348"/>
  </g>
  <g class="mono note">
    <text x="316" y="92">stable slug IDs ·</text><text x="316" y="104">never name / index</text>
    <text x="316" y="128">crawled names</text><text x="316" y="140">normalized here</text>
    <text x="316" y="164">enum registry ·</text><text x="316" y="176">label + color</text>
    <text x="316" y="200">master edges,</text><text x="316" y="212">scope-aware</text>
    <text x="316" y="236">stage views reference,</text><text x="316" y="248">never duplicate</text>
    <text x="316" y="272">prose with E13-</text><text x="316" y="284">checked highlights</text>
    <text x="316" y="308">same real-world</text><text x="316" y="320">subject, linked</text>
    <text x="316" y="344">origin · confidence ·</text><text x="316" y="356">W5 review list</text>
  </g>
</svg>
