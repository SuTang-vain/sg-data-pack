<svg width="1200" height="300" viewBox="0 0 1200 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="sg-data-pack banner">
  <defs>
    <radialGradient id="tint" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(950 150) scale(220 160)">
      <stop offset="0" stop-color="#6487FA" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#6487FA" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="heroG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7C96F5"/>
      <stop offset="1" stop-color="#6487FA"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#23252B" opacity="0.05"/>
    </pattern>
    <style>
      .sans  { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .mono  { font-family: 'SF Mono', 'Courier New', ui-monospace, monospace; }
      .ink   { fill: #23252B; }
      .muted { fill: #83868F; }
      .chip  { font-size: 12.5px; font-weight: 500; fill: #5A5E6B; }
      .lbl   { font-size: 10px; fill: #9A9DA8; letter-spacing: 0.4px; }
      .edge  { stroke: #C9CDD8; stroke-width: 1.2; }
    </style>
  </defs>

  <!-- ground -->
  <rect width="1200" height="300" fill="#FAF9F6"/>
  <rect width="1200" height="300" fill="url(#dots)"/>
  <rect width="1200" height="300" fill="url(#tint)"/>

  <!-- logo mark -->
  <g transform="translate(80 96)">
    <rect width="52" height="52" rx="13" fill="#FFFFFF" stroke="#E3E1DB"/>
    <line x1="26" y1="26" x2="14" y2="14" stroke="#B9BEDA" stroke-width="1.6"/>
    <line x1="26" y1="26" x2="39" y2="15" stroke="#B9BEDA" stroke-width="1.6"/>
    <line x1="26" y1="26" x2="26" y2="40" stroke="#B9BEDA" stroke-width="1.6"/>
    <circle cx="26" cy="26" r="7" fill="url(#heroG)"/>
    <circle cx="14" cy="14" r="3.6" fill="#FFFFFF" stroke="#C2A36B" stroke-width="1.4"/>
    <circle cx="39" cy="15" r="3.6" fill="#FFFFFF" stroke="#6FA586" stroke-width="1.4"/>
    <circle cx="26" cy="40" r="3.6" fill="#FFFFFF" stroke="#D98B8B" stroke-width="1.4"/>
  </g>

  <!-- wordmark -->
  <text x="152" y="124" class="sans ink" font-size="46" font-weight="700" letter-spacing="-1.2">sg-data-pack</text>
  <text x="153" y="158" class="sans muted" font-size="17">Component-library data-layer normalization pipeline</text>

  <!-- chips -->
  <g class="sans">
    <rect x="152" y="184" width="110" height="28" rx="14" fill="#FFFFFF" stroke="#E3E1DB"/>
    <text x="168" y="202" class="chip">E1–E15 rules</text>
    <rect x="274" y="184" width="158" height="28" rx="14" fill="#FFFFFF" stroke="#E3E1DB"/>
    <text x="290" y="202" class="chip">lossless equivalence</text>
    <rect x="444" y="184" width="142" height="28" rx="14" fill="#FFFFFF" stroke="#E3E1DB"/>
    <text x="460" y="202" class="chip">record provenance</text>
    <rect x="598" y="184" width="112" height="28" rx="14" fill="#EDF1FE" stroke="#CBD7FB"/>
    <text x="614" y="202" class="chip" fill="#4A6EE0">zero-dep CLI</text>
  </g>
  <text x="153" y="244" class="mono muted" font-size="11.5" letter-spacing="1.5">CODEX · CLAUDE CODE · ZCODE</text>

  <!-- entity graph (right) -->
  <g>
    <!-- edges -->
    <line x1="950" y1="150" x2="1062" y2="150" class="edge"/>
    <line x1="950" y1="150" x2="1006" y2="247" class="edge"/>
    <line x1="950" y1="150" x2="894" y2="247" class="edge"/>
    <line x1="950" y1="150" x2="838" y2="150" class="edge"/>
    <line x1="950" y1="150" x2="894" y2="53" class="edge"/>
    <line x1="950" y1="150" x2="1006" y2="53" class="edge"/>
    <line x1="1062" y1="150" x2="1006" y2="247" stroke="#D98B8B" stroke-width="1.2" stroke-dasharray="4 4"/>
    <rect x="1022" y="186" width="44" height="16" rx="8" fill="#FFFFFF" stroke="#E4B9B9"/>
    <text x="1031" y="197" class="mono" font-size="9" fill="#C26E6E">scope</text>

    <!-- hero -->
    <circle cx="950" cy="150" r="30" fill="url(#heroG)"/>
    <circle cx="950" cy="150" r="38" fill="none" stroke="#CBD7FB" stroke-width="1.2"/>
    <text x="950" y="155" text-anchor="middle" class="sans" font-size="12" font-weight="600" fill="#FFFFFF">hero</text>

    <!-- satellites -->
    <g class="mono lbl" text-anchor="middle">
      <circle cx="1062" cy="150" r="17" fill="#FFFFFF" stroke="#6FA586" stroke-width="1.6"/>
      <text x="1062" y="184">person</text>
      <circle cx="1006" cy="247" r="17" fill="#FFFFFF" stroke="#C2A36B" stroke-width="1.6"/>
      <text x="1006" y="281">work</text>
      <circle cx="894" cy="247" r="17" fill="#FFFFFF" stroke="#D78FAD" stroke-width="1.6"/>
      <text x="894" y="281">term</text>
      <circle cx="838" cy="150" r="17" fill="#FFFFFF" stroke="#8FA3E8" stroke-width="1.6"/>
      <text x="838" y="184">event</text>
      <circle cx="894" cy="53" r="17" fill="#FFFFFF" stroke="#D98B8B" stroke-width="1.6"/>
      <text x="894" y="87">person</text>
      <circle cx="1006" cy="53" r="17" fill="#FFFFFF" stroke="#6FA586" stroke-width="1.6"/>
      <text x="1006" y="87">person</text>
    </g>
  </g>

  <!-- baseline -->
  <line x1="80" y1="274" x2="1120" y2="274" stroke="#E3E1DB"/>
  <text x="80" y="290" class="mono muted" font-size="10" letter-spacing="1">SCHEMA IS THE ARCHITECTURE — EXTRACT · VALIDATE · SHIP DATA YOU CAN TRUST</text>
  <text x="1120" y="290" text-anchor="end" class="mono muted" font-size="10" letter-spacing="1">V1.2</text>
</svg>
