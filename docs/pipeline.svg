<svg width="1200" height="330" viewBox="0 0 1200 330" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="sg-data-pack pipeline">
  <defs>
    <pattern id="pdots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#23252B" opacity="0.045"/>
    </pattern>
    <style>
      .sans { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .mono { font-family: 'SF Mono', 'Courier New', ui-monospace, monospace; }
      .step { font-size: 10px; letter-spacing: 2px; fill: #9A9DA8; }
      .body { font-size: 11.5px; fill: #83868F; }
      .tag  { font-size: 10px; font-weight: 600; }
    </style>
  </defs>

  <rect width="1200" height="330" rx="12" fill="#FAF9F6"/>
  <rect width="1200" height="330" rx="12" fill="url(#pdots)"/>

  <!-- header -->
  <text x="48" y="46" class="sans" font-size="20" font-weight="700" fill="#23252B" letter-spacing="-0.3">The pipeline</text>
  <text x="1152" y="46" text-anchor="end" class="mono" font-size="11" fill="#9A9DA8" letter-spacing="0.5">scattered embedded data → one validated pack</text>

  <!-- STEP 01 -->
  <g transform="translate(48 76)">
    <rect width="200" height="168" rx="12" fill="#FFFFFF" stroke="#E6E3DC"/>
    <rect x="16" y="20" width="34" height="4" rx="2" fill="#C9CDD8"/>
    <text x="16" y="44" class="mono step">STEP 01</text>
    <text x="16" y="70" class="sans" font-size="18" font-weight="600" fill="#23252B">Library</text>
    <text x="16" y="98" class="sans body">embedded JS defaults</text>
    <text x="16" y="120" class="sans body">TEMPLATE-hardcoded prose</text>
    <text x="16" y="142" class="sans body">name / index references</text>
  </g>
  <g stroke="#C9CDD8" stroke-width="1.4" fill="none"><line x1="256" y1="160" x2="290" y2="160"/><path d="M290 155 l7 5 -7 5"/></g>

  <!-- STEP 02 -->
  <g transform="translate(304 76)">
    <rect width="200" height="168" rx="12" fill="#FFFFFF" stroke="#E6E3DC"/>
    <rect x="16" y="20" width="34" height="4" rx="2" fill="#8FA3E8"/>
    <text x="16" y="44" class="mono step">STEP 02</text>
    <text x="16" y="70" class="sans" font-size="18" font-weight="600" fill="#23252B">Extract</text>
    <text x="16" y="98" class="sans body">acorn literal slicing</text>
    <text x="16" y="120" class="sans body">config buildPack()</text>
    <text x="16" y="142" class="sans body">idMap + aliases</text>
  </g>
  <g stroke="#C9CDD8" stroke-width="1.4" fill="none"><line x1="512" y1="160" x2="546" y2="160"/><path d="M546 155 l7 5 -7 5"/></g>

  <!-- STEP 03 hero -->
  <g transform="translate(560 68)">
    <rect width="200" height="184" rx="12" fill="#EDF1FE" stroke="#6487FA" stroke-opacity="0.55"/>
    <rect x="16" y="20" width="34" height="4" rx="2" fill="#6487FA"/>
    <text x="16" y="44" class="mono step" fill="#6487FA">STEP 03</text>
    <text x="16" y="70" class="sans" font-size="18" font-weight="700" fill="#23252B">Data Pack</text>
    <text x="16" y="98" class="sans body" fill="#5A5E6B">entities · aliases · relations</text>
    <text x="16" y="120" class="sans body" fill="#5A5E6B">stages · contents · domain</text>
    <text x="16" y="142" class="sans body" fill="#5A5E6B">assets · sameAs · provenance</text>
    <rect x="16" y="154" width="150" height="20" rx="10" fill="#FFFFFF" stroke="#CBD7FB"/>
    <text x="26" y="168" class="mono tag" fill="#4A6EE0">lib/data/data.json · v1.2</text>
  </g>
  <g stroke="#C9CDD8" stroke-width="1.4" fill="none"><line x1="768" y1="160" x2="802" y2="160"/><path d="M802 155 l7 5 -7 5"/></g>

  <!-- STEP 04 -->
  <g transform="translate(816 76)">
    <rect width="200" height="168" rx="12" fill="#FFFFFF" stroke="#E6E3DC"/>
    <rect x="16" y="20" width="34" height="4" rx="2" fill="#6FA586"/>
    <text x="16" y="44" class="mono step">STEP 04</text>
    <text x="16" y="70" class="sans" font-size="18" font-weight="600" fill="#23252B">Validate</text>
    <text x="16" y="98" class="sans body">E1–E15 errors, fail loud</text>
    <text x="16" y="120" class="sans body">W1–W6 honest warnings</text>
    <text x="16" y="142" class="sans body">equivalence + sha1 hash</text>
  </g>
  <g stroke="#C9CDD8" stroke-width="1.4" fill="none"><line x1="1024" y1="160" x2="1058" y2="160"/><path d="M1058 155 l7 5 -7 5"/></g>

  <!-- STEP 05 -->
  <g transform="translate(1072 76)">
    <rect width="128" height="168" rx="12" fill="#FFFFFF" stroke="#E6E3DC"/>
    <rect x="16" y="20" width="34" height="4" rx="2" fill="#C2A36B"/>
    <text x="16" y="44" class="mono step">STEP 05</text>
    <text x="16" y="70" class="sans" font-size="18" font-weight="600" fill="#23252B">Mount</text>
    <text x="16" y="98" class="sans body" font-size="10.5">{ data: pack }</text>
    <text x="16" y="120" class="sans body">injected data wins</text>
    <text x="16" y="142" class="sans body">fallback intact</text>
  </g>

  <!-- footer -->
  <line x1="48" y1="286" x2="1152" y2="286" stroke="#E6E3DC"/>
  <text x="48" y="310" class="mono" font-size="10.5" fill="#9A9DA8" letter-spacing="1">CRAWL → ALIASES → DATA.JSON → VALIDATE --STRICT → EQUIVALENCE → --VERIFY-HASH → COMMIT</text>
</svg>
