<svg width="1200" height="330" viewBox="0 0 1200 330" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="sg-data-pack pipeline">
  <defs>
    <linearGradient id="pbg" x1="0" y1="0" x2="1200" y2="330" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0D1120"/>
      <stop offset="1" stop-color="#151B36"/>
    </linearGradient>
    <linearGradient id="heroCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22306B"/>
      <stop offset="1" stop-color="#1A2450"/>
    </linearGradient>
    <style>
      .title { font: 700 17px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .sub { font: 400 12.5px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #9BA3C0; }
      .badge { font: 600 11px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .cap { font: 500 13px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #7E86AC; }
    </style>
  </defs>

  <rect width="1200" height="330" rx="14" fill="url(#pbg)"/>
  <text x="40" y="42" style="font:700 20px -apple-system,'Segoe UI',sans-serif" fill="#F5F7FF">The Pipeline</text>
  <text x="176" y="42" class="cap">scattered embedded data → one validated, provenance-tracked Data Pack</text>

  <!-- ===== Card 1: Component Library ===== -->
  <g transform="translate(40 70)">
    <rect width="208" height="176" rx="12" fill="#161C33" stroke="#D94B4B" stroke-opacity="0.45"/>
    <rect width="208" height="4" rx="2" fill="#D94B4B"/>
    <!-- icon: scattered layers -->
    <g transform="translate(20 22)">
      <rect x="0" y="0" width="26" height="8" rx="2" fill="#D94B4B" opacity="0.75"/>
      <rect x="6" y="12" width="26" height="8" rx="2" fill="#D94B4B" opacity="0.5"/>
      <rect x="2" y="24" width="26" height="8" rx="2" fill="#D94B4B" opacity="0.3"/>
    </g>
    <text x="60" y="50" class="title" fill="#F0A3A3">Component Library</text>
    <text x="20" y="88" class="sub">embedded JS defaults</text>
    <text x="20" y="110" class="sub">TEMPLATE-hardcoded prose</text>
    <text x="20" y="132" class="sub">name / index references</text>
    <rect x="20" y="146" width="112" height="20" rx="10" fill="#D94B4B" opacity="0.15"/>
    <text x="30" y="160" class="badge" fill="#F0A3A3">chaos in, errors in</text>
  </g>

  <path d="M258 152 l18 6 -18 6 z" fill="#6487FA"/>
  <line x1="252" y1="158" x2="272" y2="158" stroke="#6487FA" stroke-width="2"/>

  <!-- ===== Card 2: Extract ===== -->
  <g transform="translate(282 70)">
    <rect width="208" height="176" rx="12" fill="#161C33" stroke="#6487FA" stroke-opacity="0.45"/>
    <rect width="208" height="4" rx="2" fill="#6487FA"/>
    <!-- icon: funnel / slicer -->
    <g transform="translate(20 20)">
      <path d="M0 0 H34 L22 16 V30 L12 26 V16 Z" fill="#6487FA" opacity="0.8"/>
    </g>
    <text x="66" y="50" class="title" fill="#B9C4F5">Extract</text>
    <text x="20" y="88" class="sub">acorn literal slicing</text>
    <text x="20" y="110" class="sub">config buildPack()</text>
    <text x="20" y="132" class="sub">idMap + aliases</text>
    <rect x="20" y="146" width="88" height="20" rx="10" fill="#6487FA" opacity="0.15"/>
    <text x="30" y="160" class="badge" fill="#B9C4F5">lossless by test</text>
  </g>

  <path d="M500 152 l18 6 -18 6 z" fill="#6487FA"/>
  <line x1="494" y1="158" x2="514" y2="158" stroke="#6487FA" stroke-width="2"/>

  <!-- ===== Card 3: Data Pack (hero) ===== -->
  <g transform="translate(524 62)">
    <rect width="208" height="192" rx="12" fill="url(#heroCard)" stroke="#8AA5FF" stroke-opacity="0.8"/>
    <rect width="208" height="4" rx="2" fill="#8AA5FF"/>
    <!-- icon: node graph -->
    <g transform="translate(20 20)">
      <line x1="14" y1="14" x2="30" y2="6" stroke="#8AA5FF" stroke-width="1.8"/>
      <line x1="14" y1="14" x2="32" y2="24" stroke="#8AA5FF" stroke-width="1.8"/>
      <circle cx="14" cy="14" r="7" fill="#8AA5FF"/>
      <circle cx="32" cy="6" r="4.5" fill="#4AA06E"/>
      <circle cx="34" cy="26" r="4.5" fill="#C8A35A"/>
    </g>
    <text x="66" y="50" class="title" fill="#E7EBFF">Data Pack</text>
    <text x="20" y="88" class="sub" fill="#C3CBF2">entities · aliases · relations</text>
    <text x="20" y="110" class="sub" fill="#C3CBF2">stages · contents · domain</text>
    <text x="20" y="132" class="sub" fill="#C3CBF2">assets · sameAs · provenance</text>
    <rect x="20" y="152" width="152" height="22" rx="11" fill="#8AA5FF" opacity="0.2"/>
    <text x="30" y="167" class="badge" fill="#E7EBFF">lib/data/data.json · v1.2</text>
  </g>

  <path d="M742 152 l18 6 -18 6 z" fill="#6487FA"/>
  <line x1="736" y1="158" x2="756" y2="158" stroke="#6487FA" stroke-width="2"/>

  <!-- ===== Card 4: Validate ===== -->
  <g transform="translate(766 70)">
    <rect width="208" height="176" rx="12" fill="#161C33" stroke="#4AA06E" stroke-opacity="0.45"/>
    <rect width="208" height="4" rx="2" fill="#4AA06E"/>
    <!-- icon: shield check -->
    <g transform="translate(20 18)">
      <path d="M17 0 L34 6 V18 C34 30 26 37 17 40 C8 37 0 30 0 18 V6 Z" fill="#4AA06E" opacity="0.25" stroke="#4AA06E" stroke-width="2"/>
      <path d="M9 19 l6 6 11 -12" stroke="#6FCF8F" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="66" y="50" class="title" fill="#9FD8B4">Validate</text>
    <text x="20" y="88" class="sub">E1–E15 errors · fail loud</text>
    <text x="20" y="110" class="sub">W1–W6 honest warnings</text>
    <text x="20" y="132" class="sub">equivalence + sha1 hash</text>
    <rect x="20" y="146" width="118" height="20" rx="10" fill="#4AA06E" opacity="0.15"/>
    <text x="30" y="160" class="badge" fill="#9FD8B4">no silent swallowing</text>
  </g>

  <path d="M984 152 l18 6 -18 6 z" fill="#6487FA"/>
  <line x1="978" y1="158" x2="998" y2="158" stroke="#6487FA" stroke-width="2"/>

  <!-- ===== Card 5: Engine Mount ===== -->
  <g transform="translate(1008 70)">
    <rect width="192" height="176" rx="12" fill="#161C33" stroke="#C8A35A" stroke-opacity="0.5"/>
    <rect width="192" height="4" rx="2" fill="#C8A35A"/>
    <!-- icon: plug -->
    <g transform="translate(20 20)">
      <rect x="4" y="8" width="22" height="16" rx="3" fill="#C8A35A" opacity="0.8"/>
      <line x1="30" y1="12" x2="38" y2="12" stroke="#C8A35A" stroke-width="3" stroke-linecap="round"/>
      <line x1="30" y1="20" x2="38" y2="20" stroke="#C8A35A" stroke-width="3" stroke-linecap="round"/>
    </g>
    <text x="66" y="50" class="title" fill="#EAD1A0">Engine Mount</text>
    <text x="20" y="88" class="sub">{ data: SG_DATA_PACK }</text>
    <text x="20" y="110" class="sub">injected data wins</text>
    <text x="20" y="132" class="sub">legacy fallback intact</text>
    <rect x="20" y="146" width="128" height="20" rx="10" fill="#C8A35A" opacity="0.16"/>
    <text x="30" y="160" class="badge" fill="#EAD1A0">zero render changes</text>
  </g>

  <!-- caption -->
  <text x="40" y="302" class="cap">crawl → aliases → data.json → validate --strict → equivalence test → --verify-hash → commit</text>
</svg>
