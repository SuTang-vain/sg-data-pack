<!doctype html>
<html><head><meta charset="utf-8"><style>
*{box-sizing:border-box}body{margin:0;background:#f8fafc;color:#0f172a;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}#mount{width:960px;min-height:600px;padding:64px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}.card{height:180px;display:flex;align-items:flex-end;padding:24px;border-radius:14px;background:linear-gradient(145deg,var(--accent),#111827);color:white;font-size:22px;font-weight:700;box-shadow:0 18px 45px rgba(15,23,42,.18)}
</style></head><body><main id="mount"></main>
<script>(function(){var e={console:[],page:[],network:[]};function sync(){document.body.dataset.consoleErrors=encodeURIComponent(JSON.stringify(e.console));document.body.dataset.pageErrors=encodeURIComponent(JSON.stringify(e.page));document.body.dataset.networkFailures=encodeURIComponent(JSON.stringify(e.network));}var original=console.error;console.error=function(){e.console.push(Array.prototype.join.call(arguments,' '));sync();return original.apply(console,arguments);};addEventListener('error',function(event){var target=event.target;if(target&&target!==window&&(target.src||target.href))e.network.push(String(target.src||target.href));else e.page.push(String(event.message||event.error||'page error'));sync();},true);addEventListener('unhandledrejection',function(event){e.page.push(String(event.reason||'unhandled rejection'));sync();});sync();}());</script>
<script src="../data/data.js"></script><script src="../src/cards.js"></script>
<script>PatternCCards.mount(document.getElementById('mount'),{data:SG_DATA_PACK});</script>
</body></html>
