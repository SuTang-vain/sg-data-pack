# CI：sg-data-pack skill 自检（CLI smoke + 零依赖验证）
name: skill-smoke

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Zero-dependency check (no node_modules required)
        run: |
          test ! -d node_modules && echo "zero-dep ok"
          node scripts/sg-data-pack 2>&1 | head -3 || true

      - name: templatize smoke (byte-exact on tiny fixture)
        run: |
          cat > /tmp/inst.json <<'EOF'
          ["<div><h4>Alpha</h4><p>one</p></div>", "<div><h4>Beta</h4><p>two</p></div>", "<div><h4>Gamma</h4><p>three</p></div>"]
          EOF
          node scripts/sg-data-pack templatize /tmp/inst.json | grep -q "byte-exact verification: OK"

      - name: alias-candidates smoke
        run: |
          cat > /tmp/pack.json <<'EOF'
          {"entities":{"chengbing":{"kind":"person","name":"程兵"}},"aliases":{"程兵":"chengbing"}}
          EOF
          printf '程兵\n程 兵\n' > /tmp/names.txt
          node scripts/sg-data-pack alias-candidates /tmp/pack.json /tmp/names.txt | grep -q "chengbing" || test $? -eq 1

      - name: types smoke (generate + key markers)
        run: |
          cat > /tmp/pack2.json <<'EOF'
          {"schemaVersion":"1.3","meta":{"id":"demo","title":"Demo"},"entities":{"a":{"kind":"person","name":"A","side":"left"},"b":{"kind":"person","name":"B","side":"right"}},"aliases":{},"relationTypes":{},"relations":[],"stages":[],"contents":{},"domain":{},"assets":{}}
          EOF
          node scripts/sg-data-pack types /tmp/pack2.json --name Demo --out /tmp/demo.d.ts
          grep -q 'kind: "person"' /tmp/demo.d.ts
          grep -q '"left" | "right"' /tmp/demo.d.ts

      - name: SKILL.md frontmatter parses
        run: |
          node -e "const s=require('fs').readFileSync('SKILL.md','utf8');const m=s.match(/^---\n([\s\S]*?)\n---/);if(!m||!/name: sg-data-pack/.test(m[1]))process.exit(1);console.log('frontmatter ok')"

      - name: Contract + pilot test suite (loader / diff / recrawl / types / consistency)
        run: |
          node --test "tests/*.test.js"
